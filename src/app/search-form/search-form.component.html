<form class="search-form" #searchForm="ngForm" (ngSubmit)="search()">
  <input
    type="text"
    name="searchTerm"
    id="searchTerm"
    class="form-control"
    placeholder="GitHub username"
    [(ngModel)]="searchTerm"
    autocomplete="off">

  <button type="submit" class="btn btn-success">Search</button>
</form>
